    <!-- HandlebarJs -->

    <script id="blogs-template" type="text/x-handlebars-template">
        {{#each data.data}}
        <div class="py-4 clear-both">
            <h2 class="font-heading text-3xl">
                <a href="blog-details.html?id={{id}}">{{title}}
                </a>
            </h2>
            <p class="py-4">by {{#if author}}{{author.name}}{{else}}Anomynous{{/if}} in <a href="blogs.html?category={{category_id}}">{{category.name}}</a> on {{formatDate created_at}} <a href="blog-details.html#comments">Comments {{comments.length}}</a></p>
            <a href="blog-details.html?id={{id}}">
                <img src="{{thumbpath}}" alt="{{title}}" class="float-start mb-8 me-8 rounded-xl">
            </a>
            <p class="text-justify">{{summary}}</p>
            <a href="blog-details.html?id={{id}}" class="read-more">Read more...</a>
        </div>
        {{/each}}

        {{#with data.pagination}}
        <nav aria-label="Page navigation example" class="clear-both mt-8 flex justify-center">
            {{#pagination currentPage pageCount size}}
            <ul class="flex -space-x-px text-sm">
                {{#unless startFromFirstPage}}
                <li>
                <a href="blogs.html?page={{../prevPage}}&category={{../category}}&keyword={{../keyword}}" class="flex items-center justify-center text-body bg-neutral-secondary-medium box-border border border-default-medium hover:bg-neutral-tertiary-medium hover:text-heading font-medium rounded-s-base text-sm w-9 h-9 focus:outline-none">
                    <span class="sr-only">Previous</span>
                    <svg class="w-4 h-4 rtl:rotate-180" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m15 19-7-7 7-7"/></svg>
                </a>
                </li>
                {{/unless}}

                {{#each pages}}
                {{#if isCurrent}}
                <li>
                <a href="#" aria-current="page" class="flex items-center justify-center text-fg-brand bg-neutral-tertiary-medium box-border border border-default-medium hover:text-fg-brand font-medium text-sm w-9 h-9 focus:outline-none active">{{page}}</a>
                </li>
                {{/if}}

                {{#unless isCurrent}}
                <li>
                <a href="blogs.html?page={{page}}&category={{../../category}}&keyword={{../../keyword}}" class="flex items-center justify-center text-body bg-neutral-secondary-medium box-border border border-default-medium hover:bg-neutral-tertiary-medium hover:text-heading font-medium text-sm w-9 h-9 focus:outline-none">{{page}}</a>
                </li>
                {{/unless}}
                {{/each}}
                {{#unless endAtLastPage}}
                <li>
                <a href="blogs.html?page={{../nextPage}}&category={{../category}}&keyword={{../keyword}}" class="flex items-center justify-center text-body bg-neutral-secondary-medium box-border border border-default-medium hover:bg-neutral-tertiary-medium hover:text-heading font-medium rounded-e-base text-sm w-9 h-9 focus:outline-none">
                    <span class="sr-only">Next</span>
                    <svg class="w-4 h-4 rtl:rotate-180" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m9 5 7 7-7 7"/></svg>
                </a>
                </li>
                {{/unless}}
            </ul>
            {{/pagination}}
        </nav>
        {{/with}}
    </script>

    <script id="categories-template" type="text/x-handlebars-template">
        <li class="flex items-center" id="categoryAll">

            <a href="blogs.html">Show All</a>

        </li>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/mssv.js"></script>
    <script src="js/database.js"></script>


    <script>
        (async function () {
            const params = new URLSearchParams(window.location.search)
            const categoryId = params.get('category') ?? "All";
            const page = params.get('page') ?? 1;
            const keyword = params.get('keyword') ?? "";

            const [categories, blogs] = await Promise.all([
                fetchCategoriesByType("blogs"),
                fetchBlogsByCategoryId(keyword, categoryId, page),
            ]);

            console.log(blogs);
            renderView("categories-template", 'categories', { categories, keyword });
            renderView("blogs-template", 'blogs', blogs);

            highlightCategoryTab(categoryId);

        })();

        function highlightCategoryTab(categoryId) {
            const categoriesRoot = document.querySelector("#categories");
            if (!categoriesRoot) return;

            categoriesRoot.querySelector(".active")?.classList.remove('active');

            categoriesRoot.querySelector(`#category${categoryId} a`)?.classList.add('active');
        }


    </script>
